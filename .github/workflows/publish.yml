on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libglpk-dev libxml2-dev

      - name: Restore R package dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1
        env:
          # renv.lock includes packages hosted in GitHub repositories.
          # Supplying the workflow token avoids unauthenticated API rate limits
          # while restoring those pinned dependencies.
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
